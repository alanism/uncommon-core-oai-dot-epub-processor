[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uncommon-core-oai-dot-epub-processor"
version = "0.1.0"
description = "UnCommon Core OAI Dot ePub Processor: offline provenance and host-mediated learning jobs"
license = {file = "LICENSE"}
authors = [{name = "Alan Nguyen"}]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ucc-headless = "ucc_headless.__main__:main"

[tool.setuptools.packages.find]
include = ["ucc_headless*"]
